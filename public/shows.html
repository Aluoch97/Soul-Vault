<script charset="utf-8" src="https://widgetv3.bandsintown.com/main.min.js"></script>
<script>
  // Open ticket / RSVP links in a new tab: this page is shown inside the app's Tour tab.
  var b = document.createElement('base'); b.target = '_blank'; document.head.appendChild(b);
  // Open the "Past Shows" list by default so every show is visible. Gives up quietly if the widget changes.
  (function () {
    var done = false;
    function openPast() {
      if (done) return;
      var els = document.querySelectorAll('a, button, span, div');
      for (var i = 0; i < els.length; i++) {
        var e = els[i];
        if (e.children.length === 0 && e.textContent.trim() === 'Past Shows') { done = true; e.click(); obs.disconnect(); return; }
      }
    }
    var obs = new MutationObserver(openPast);
    obs.observe(document.body, { childList: true, subtree: true });
    openPast();
    setTimeout(function () { obs.disconnect(); }, 20000);
  })();
</script>
