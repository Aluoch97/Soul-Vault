function cleanCoverRow(r) {
  return `<div class="ccrow"><span class="lbl">Clean version cover (shows in the player whenever a Clean version plays)</span>
    ${r.clean_cover_file_id ? `<img class="art" data-cover="${esc(r.clean_cover_file_id)}" alt="Clean cover">` : ''}
    <button class="pill soft" type="button" data-cc-pick>${I.img}${r.clean_cover_file_id ? 'Change clean cover' : 'Upload clean cover'}</button>
    ${r.clean_cover_file_id ? '<button class="pill soft" type="button" data-cc-clear>Remove</button>' : ''}</div>`;
}
function afterCleanCover(r) {
  const row = $('.ccrow'); if (row) { row.outerHTML = cleanCoverRow(r); loadCovers(); }
  if (S.now && S.now.r.release_id === r.release_id) updateNowUI();
}
async function uploadCleanCover(file) {
  const r = rel(S.releaseId);
  if (file.size > 15 * 1048576) throw new Error('That image is over 15 MB.');
  let thumb = await shrinkImage(file, 320, 0.72); if (thumb.length > 44000) thumb = await shrinkImage(file, 240, 0.6);
  const ticket = await run('getUploadTicket', BOOT.key, r.release_id);
  let blob = file, name = 'Clean cover.gif', type = 'image/gif';
  if (file.type !== 'image/gif') { blob = await (await fetch(await shrinkImage(file, 1600, 0.9))).blob(); name = 'Clean cover.jpg'; type = 'image/jpeg'; }
  const id = await driveUpload(blob, name, type, ticket);
  const out = await run('setCleanCover', BOOT.key, r.release_id, id, thumb);
  r.clean_cover_file_id = out.fileId; r.clean_cover_thumb = out.thumb || '';
  S.covers[id] = out.thumb || thumb; S.coverP[id] = Promise.resolve(S.covers[id]);
  afterCleanCover(r);
}
$('#cleanFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  toast('Uploading clean cover…');
  try { await uploadCleanCover(f); toast('Clean cover saved'); } catch (err) { toast(err.message || 'The clean cover did not upload.'); }
});
async function removeCleanCover() {
  const r = rel(S.releaseId);
  try { await run('setCleanCover', BOOT.key, r.release_id, '', ''); r.clean_cover_file_id = ''; r.clean_cover_thumb = ''; afterCleanCover(r); toast('Clean cover removed'); }
  catch (e) { toast(e.message || 'Could not remove the clean cover'); }
}

  if (ds.vtype != null && S.vdraft) { S.vdraft[+ds.vtype].type = VTYPE[e.target.value] ? e.target.value : 'music'; return; }
  if (!S.draft) return;
  if (ds.hideTrack != null) { S.draft[+ds.hideTrack].hidden = e.target.checked; e.target.closest('.erow').classList.toggle('hid', e.target.checked); }
  else if (ds.primary != null) S.draft[+ds.primary].primary = e.target.value;
  else if (ds.cat != null) S.draft[+ds.cat].category = e.target.value;
  else if (ds.single != null) S.draft[+ds.single].single = e.target.checked;
  else if (ds.hideVer != null) {
    const d = S.draft[+ds.hideVer], id = e.target.value;
    d.hiddenVersions = e.target.checked ? d.hiddenVersions.concat(id) : d.hiddenVersions.filter(x => x !== id);
  }
});

document.addEventListener('change', async e => {
  const tok = e.target.dataset && e.target.dataset.active;
  if (!tok) return;
  const on = e.target.checked; e.target.disabled = true;
  try {
    await run('setShareActive', BOOT.key, tok, on);
    const s = S.lib.shares.find(x => x.token === tok); if (s) s.active = on;
  } catch (err) { e.target.checked = !on; alert(err.message || 'Could not update this link.'); }
  e.target.disabled = false;
});

document.addEventListener('keydown', e => {
  trapFocus(e);
  if (S.sync && e.key === ' ' && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { e.preventDefault(); e.stopImmediatePropagation(); syncTap(); return; }
  if (e.key === 'Escape') { if (!$('#modal').hidden) closeModal(); else if (!$('#np').hidden) closeNp(); }
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && $('.lightbox')) { e.preventDefault(); openPhoto(S.photoAt + (e.key === 'ArrowRight' ? 1 : -1)); }
  if (e.key === ' ' && !/INPUT|SELECT|BUTTON|TEXTAREA/.test(e.target.tagName) && audio.src) {
    e.preventDefault(); audio.paused ? audio.play() : audio.pause();
  }
});

window.SV_APP_COMPLETE = true;
init();
</script>
</body>
</html>
