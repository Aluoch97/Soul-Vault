<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Soul Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:    #1C1920;   /* violet charcoal */
    --side:  #151318;   /* sidebar */
    --raise: rgba(255,255,255,.06);
    --hover: rgba(255,255,255,.09);
    --line:  rgba(255,255,255,.08);
    --text:  #F4EEF2;
    --dim:   #A79DAB;
    --brass: #E3A857;   /* play state, focus */
    --tint:  #3B3042;   /* replaced per release from its cover */
    --serif: 'Instrument Serif', Georgia, serif;
    --sans:  'Manrope', system-ui, sans-serif;
    --sidew: 236px;
    --r-art: 8px;  --r-ui: 10px;  --r-pill: 999px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  /* Entering Vault: a vault door unlocking while the app loads */
  .vload { min-height: 70vh; display: grid; place-content: center; justify-items: center; gap: 18px; text-align: center; }
  .vdoor { position: relative; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #3a3a3e, #151517 70%);
           border: 6px solid #2a2a2d; box-shadow: 0 0 0 3px #0c0c0d, 0 0 40px rgba(210,16,52,.25), inset 0 0 22px #000; animation: vglow 2.4s ease-in-out infinite; }
  .vwheel { position: absolute; inset: 34px; border-radius: 50%; border: 5px solid #C9A227; animation: vspin 2.2s cubic-bezier(.65,0,.35,1) infinite; }
  .vwheel i { position: absolute; left: 50%; top: 50%; width: 5px; height: 88px; margin: -44px 0 0 -2.5px; background: #C9A227; border-radius: 3px; }
  .vwheel i:nth-child(2) { transform: rotate(60deg); } .vwheel i:nth-child(3) { transform: rotate(120deg); }
  .vb { position: absolute; background: #6f6f75; border-radius: 3px; animation: vbolt 2.2s ease-in-out infinite; }
  .vb.t, .vb.b { width: 14px; height: 22px; left: 62px; } .vb.t { top: -14px; } .vb.b { bottom: -14px; }
  .vb.l, .vb.r { width: 22px; height: 14px; top: 62px; } .vb.l { left: -14px; } .vb.r { right: -14px; }
  .vtext { margin: 0; font: 800 20px/1.2 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: #F6F3EF; }
  .vdots i { font-style: normal; animation: vdot 1.2s infinite; } .vdots i:nth-child(2) { animation-delay: .2s; } .vdots i:nth-child(3) { animation-delay: .4s; }
  @keyframes vspin { 0% { transform: rotate(0); } 60%, 100% { transform: rotate(270deg); } }
  @keyframes vbolt { 0%, 40% { opacity: 1; scale: 1; } 70%, 100% { opacity: .25; scale: .6; } }
  @keyframes vglow { 50% { box-shadow: 0 0 0 3px #0c0c0d, 0 0 60px rgba(201,162,39,.35), inset 0 0 22px #000; } }
  @keyframes vdot { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .vdoor, .vwheel, .vb, .vdots i { animation: none; } }
  html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 6px; }
  img { display: block; }
  svg { display: block; }

  /* ── Sidebar ── */
  .side { position: fixed; inset: 0 auto 0 0; width: var(--sidew); background: var(--side); border-right: 1px solid var(--line);
          padding: 22px 12px 120px; overflow-y: auto; }
  .brand { font: 26px/1 var(--serif); padding: 0 12px 22px; }
  .side nav { display: grid; gap: 2px; }
  .nav { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px; color: var(--dim); font-weight: 600; }
  .nav:hover { background: var(--raise); color: var(--text); }
  .nav[aria-current="page"] { background: var(--hover); color: var(--text); }
  .nav svg { width: 18px; height: 18px; }
  .side h3 { margin: 26px 12px 6px; font-size: 12px; font-weight: 700; color: var(--dim); }
  .yrs { display: grid; gap: 1px; }
  .yrs button { padding: 5px 12px; border-radius: 6px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .yrs button:hover { background: var(--raise); color: var(--text); }

  main { margin-left: var(--sidew); min-height: 100vh; padding-bottom: 130px; }
  .share-mode main { margin-left: 0; }
  .share-mode .side { display: none; }
  .wrap { padding: 0 clamp(18px, 3.5vw, 44px); max-width: 1320px; }
  .status { color: var(--dim); padding: 60px clamp(18px, 3.5vw, 44px); max-width: 56ch; }

  /* ── Library ── */
  .libhead { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; padding: 30px 0 8px; }
  .libhead h1 { margin: 0 auto 0 0; font: 400 44px/1 var(--serif); }
  .search { display: flex; align-items: center; gap: 8px; background: var(--raise); border-radius: var(--r-ui); padding: 8px 12px; width: min(280px, 100%); }
  .search svg { width: 16px; height: 16px; color: var(--dim); flex: none; }
  .search input { background: none; border: 0; outline: 0; width: 100%; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 0 4px; }
  .seg button { padding: 6px 14px; border-radius: var(--r-pill); background: var(--raise); color: var(--dim); font-weight: 600; font-size: 13px; }
  .seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .ygroup { padding-top: 26px; scroll-margin-top: 12px; }
  .ygroup h2 { margin: 0 0 14px; font: 400 30px/1 var(--serif); color: var(--dim); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 26px 20px; }
  .card { display: grid; gap: 3px; align-content: start; }
  .card .art { margin-bottom: 8px; }
  .art { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--raise); border-radius: var(--r-art);
         box-shadow: 0 14px 30px -18px rgba(0,0,0,.9); }
  .card:hover .art { filter: brightness(1.08); }
  .ct { font-weight: 600; line-height: 1.3; }
  .cs { color: var(--dim); font-size: 13px; }
  .songs { margin-top: 22px; }

  /* ── Release page ── */
  .relhead { background: linear-gradient(180deg, var(--tint) 0%, color-mix(in srgb, var(--tint) 35%, var(--bg)) 70%, var(--bg) 100%);
             transition: background .6s ease; padding-bottom: 26px; }
  .back { display: inline-flex; align-items: center; gap: 4px; color: var(--text); opacity: .75; font-weight: 600; padding: 22px 0 0; }
  .back:hover { opacity: 1; }
  .back svg { width: 18px; height: 18px; }
  .hero { display: grid; grid-template-columns: minmax(180px, 260px) 1fr; gap: 30px; align-items: end; padding-top: 22px; }
  .hero .art { box-shadow: 0 24px 50px -20px rgba(0,0,0,.85); }
  .kind { font-size: 13px; font-weight: 700; opacity: .8; }
  .hero h1 { margin: 4px 0 8px; font: 400 clamp(38px, 5.6vw, 72px)/0.98 var(--serif); }
  .hero .cs { color: rgba(244,238,242,.75); }
  .acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .pill { white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: var(--r-pill); font-weight: 700; }
  .pill svg { width: 16px; height: 16px; }
  .pill.main { background: var(--brass); color: #231A12; }
  .pill.soft { background: rgba(255,255,255,.12); }
  .pill.soft:hover { background: rgba(255,255,255,.18); }
  .pill:disabled { opacity: .6; cursor: default; }

  .tracks { list-style: none; margin: 8px 0 0; padding: 0; }
  .row { display: grid; grid-template-columns: 40px minmax(0,1fr) auto 64px; gap: 12px; align-items: center;
         padding: 8px 10px; border-radius: 8px; }
  .row:hover { background: var(--raise); }
  .row + .row { border-top: 1px solid var(--line); }
  .row:hover + .row, .row:hover { border-color: transparent; }
  .idx { position: relative; width: 28px; height: 28px; display: grid; place-items: center; color: var(--dim); font-variant-numeric: tabular-nums; }
  .idx svg { width: 14px; height: 14px; display: none; color: var(--text); }
  @media (hover: hover) {
    .row:hover .idx .n { display: none; }
    .row:hover .idx svg { display: block; }
    .row.on:hover .idx svg { display: none; }
  }
  .row.on .idx .n { display: none; }
  .eq { display: none; gap: 2px; align-items: flex-end; height: 14px; }
  .row.on .eq { display: flex; }
  .eq i { width: 3px; background: var(--brass); border-radius: 1px; animation: eq 1s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.6s; }
  .paused .eq i { animation-play-state: paused; }
  @keyframes eq { 0%,100% { height: 4px; } 50% { height: 14px; } }
  .tt { font-weight: 600; display: block; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.on .tt { color: var(--brass); }
  .ta { color: var(--dim); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: 12px; font-weight: 600; color: var(--dim); padding: 3px 10px; border-radius: var(--r-pill); background: var(--raise); }
  .chip:hover { color: var(--text); background: var(--hover); }
  .chip.on { background: var(--brass); color: #231A12; }
  .dur { color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; }
  .rowact { display: flex; justify-content: flex-end; }
  .ib { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; color: var(--dim); }
  .ib:hover { color: var(--text); background: var(--hover); }
  .ib svg { width: 17px; height: 17px; }
  @media (hover: hover) {
    .row .ib { opacity: 0; }
    .row:hover .ib, .row:focus-within .ib { opacity: 1; }
  }

  /* ── Cover change + edit mode ── */
  .artwrap { position: relative; width: 100%; }
  .artwrap .art { width: 100%; }
  .covbtn { position: absolute; inset: 0; border-radius: var(--r-art); display: grid; place-items: end center;
            padding-bottom: 14px; color: #fff; font-weight: 700; font-size: 13px; opacity: 0;
            background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,.65)); transition: opacity .2s; }
  .covbtn span { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--r-pill); background: rgba(0,0,0,.45); }
  .covbtn svg { width: 15px; height: 15px; }
  .artwrap:hover .covbtn, .covbtn:focus-visible, .covbtn.busy { opacity: 1; }
  @media (hover: none) { .covbtn { opacity: 1; background: none; } }
  .edit-title { width: 100%; font: 400 clamp(32px, 5vw, 60px)/1.05 var(--serif); color: var(--text);
                background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 10px; padding: 4px 12px; margin: 4px 0 8px; }
  .erow { display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 8px 4px; border-top: 1px solid var(--line); }
  .erow:first-child { border-top: 0; }
  .erow .n { color: var(--dim); font-variant-numeric: tabular-nums; text-align: center; }
  .erow input { width: 100%; background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; color: var(--text); font-weight: 600; }
  .erow input:focus { border-color: var(--brass); outline: 0; }
  .erow .numin { width: 52px; padding: 10px 4px; text-align: center; font-variant-numeric: tabular-nums; }
  .eopts .artin { display: grid; gap: 4px; align-items: start; }
  .eopts .artin .field { padding: 8px 10px; max-width: 380px; font-weight: 500; }
  .eopts .artin .note { font-weight: 500; color: var(--dim); }
  .moves { display: flex; gap: 4px; }
  .moves .ib { width: 40px; height: 40px; background: var(--raise); }
  .moves .ib:disabled { opacity: .3; cursor: default; }
  .editbar { position: static;   /* was sticky; it covered the last songs' drag handles (Save is also at the top) */ display: flex; justify-content: flex-end; gap: 10px; padding: 14px 0;
             background: linear-gradient(180deg, transparent, var(--bg) 35%); }
  .erow.moved { animation: nudge .35s ease; }
  @keyframes nudge { from { background: rgba(227,168,87,.18); } to { background: transparent; } }

  /* ── Queue / sheets / jobs / comments ── */
  .acts .pill.icon-only { padding: 10px 14px; }
  .tools { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .sheetlist { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
  .sheetlist button { display: flex; gap: 12px; align-items: center; width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 10px; font-weight: 600; }
  .sheetlist button:hover { background: var(--raise); }
  .sheetlist svg { width: 18px; height: 18px; color: var(--dim); flex: none; }
  .bar { height: 4px; background: rgba(255,255,255,.15); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: var(--p, 0%); background: var(--brass); transition: width .2s; }
  .job { position: fixed; left: calc(var(--sidew) + 16px); right: 16px; bottom: 96px; z-index: 15; display: grid; gap: 8px;
         padding: 12px 14px; border-radius: 12px; background: #2A2530; border: 1px solid var(--line); font-size: 13px; }
  .job .jt { display: flex; justify-content: space-between; gap: 12px; }
  .toast { position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%); z-index: 45; padding: 9px 18px; border-radius: var(--r-pill);
           background: var(--text); color: var(--bg); font-weight: 700; font-size: 13px; box-shadow: 0 10px 30px -10px #000; }
  .recent { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
  .rc { display: grid; grid-template-columns: 48px minmax(0,1fr); gap: 12px; align-items: center; padding: 6px; border-radius: 10px; background: var(--raise); }
  .rc:hover { background: var(--hover); }
  .rc .art { width: 48px; border-radius: 6px; }
  .rc .ct, .rc .cs { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hint { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-top: 16px; padding: 12px 14px;
          background: var(--raise); border-radius: 12px; font-size: 13px; }
  .hint .ib { flex: none; }
  .scrub .marks { grid-column: 2; position: relative; height: 8px; margin-top: -4px; }
  .scrub .marks i { position: absolute; top: 0; width: 6px; height: 6px; border-radius: 50%; background: var(--brass); transform: translateX(-50%); }
  .npx { display: flex; justify-content: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .credits { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 14px; }
  .credits dt { color: rgba(244,238,242,.6); }
  .credits dd { margin: 0; }
  .clist { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; }
  .clist li { display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 10px; align-items: start; padding: 8px; border-radius: 8px; background: rgba(255,255,255,.05); }
  .clist li.done { opacity: .5; }
  .clist .when { color: var(--brass); font-weight: 700; font-variant-numeric: tabular-nums; min-height: 32px; }
  .clist p { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .clist .who { font-size: 12px; color: rgba(244,238,242,.6); }
  .cact { display: flex; gap: 2px; }
  .cform { display: grid; gap: 8px; margin-top: 10px; }
  .cform textarea, .cform input { width: 100%; background: rgba(0,0,0,.28); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; color: var(--text); font: inherit; }
  .cform textarea { min-height: 84px; resize: vertical; }
  .cform .end { display: flex; justify-content: flex-end; gap: 8px; }
  .eopts { grid-column: 2 / -1; display: grid; gap: 6px; font-size: 13px; color: var(--dim); padding: 2px 0 6px; }
  .eopts label { display: flex; gap: 8px; align-items: center; min-height: 32px; }
  .eopts input[type=checkbox], .eopts input[type=radio] { accent-color: var(--brass); width: 18px; height: 18px; }
  .eopts .vline { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; }
  .erow.hid input[data-draft] { opacity: .45; text-decoration: line-through; }
  .dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .dgrid .full { grid-column: 1 / -1; }
  .sheet textarea.field { min-height: 90px; resize: vertical; font: inherit; }
  .sheet .prog { display: grid; gap: 8px; }

  /* ── Share links page ── */
  .page-h { margin: 0; padding: 30px 0 18px; font: 400 44px/1 var(--serif); }
  .links { display: grid; gap: 10px; }
  .link { display: grid; grid-template-columns: 52px minmax(0,1fr) auto auto auto; gap: 16px; align-items: center;
          padding: 12px 16px 12px 12px; background: var(--raise); border-radius: 12px; }
  .link .art { width: 52px; border-radius: 6px; }
  .link strong { display: block; }
  .tog { position: relative; width: 40px; height: 24px; flex: none; margin: 10px 2px; }
  .tog::before { content: ''; position: absolute; inset: -10px -4px; }
  .tog input { position: absolute; inset: -10px -4px; width: calc(100% + 8px); height: calc(100% + 20px); opacity: 0; cursor: pointer; margin: 0; z-index: 1; }
  .tog span { position: absolute; inset: 0; border-radius: 12px; background: rgba(255,255,255,.18); transition: background .2s; pointer-events: none; }
  .tog span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .tog input:checked + span { background: var(--brass); }
  .tog input:checked + span::after { transform: translateX(16px); }
  .tog input:focus-visible + span { outline: 2px solid var(--brass); outline-offset: 2px; }

  /* ── Mini player ── */
  .mini { position: fixed; left: calc(var(--sidew) + 16px); right: 16px; bottom: 14px; display: grid;
          grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.3fr); gap: 24px; align-items: center;
          padding: 10px 14px; border-radius: 14px; background: rgba(40,35,45,.78);
          backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4);
          border: 1px solid var(--line); box-shadow: 0 20px 40px -18px rgba(0,0,0,.8); }
  .share-mode .mini { left: 16px; }
  .mini .art { width: 48px; border-radius: 6px; }
  .mini .open { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .mt { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ms { color: var(--dim); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ctl { display: flex; align-items: center; gap: 6px; }
  .ctl .ib { color: var(--text); }
  .ctl .ib svg { width: 20px; height: 20px; }
  .pp { width: 44px; height: 44px; border-radius: 50%; background: var(--text); color: var(--bg); display: grid; place-items: center; }
  .pp svg { width: 18px; height: 18px; }
  .scrub { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; color: var(--dim);
           font-size: 12px; font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 2px; cursor: pointer;
    background: linear-gradient(90deg, var(--text) var(--p, 0%), rgba(255,255,255,.2) var(--p, 0%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--text); }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--text); }
  .mprog { display: none; position: absolute; left: 14px; right: 14px; bottom: 0; height: 2px; border-radius: 2px; overflow: hidden; background: rgba(255,255,255,.15); }
  .mprog i { display: block; height: 100%; width: var(--p, 0%); background: var(--brass); }
  .msg { grid-column: 1 / -1; color: var(--brass); font-size: 12px; }

  /* ── Now playing ── */
  .np { position: fixed; inset: 0; z-index: 20; overflow-y: auto; background: #120F14; }
  .np-bg { position: fixed; inset: -80px; background-size: cover; background-position: center; filter: blur(70px) saturate(1.3) brightness(.45); transform: scale(1.1); }
  .np-in { position: relative; min-height: 100%; display: grid; grid-template-rows: auto 1fr; padding: 18px clamp(18px, 4vw, 56px) 40px; }
  .np.opening .np-in { animation: rise .35s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .np-top .ib { color: var(--text); }
  .np-top .ib svg { width: 24px; height: 24px; }
  .np-body { display: grid; grid-template-columns: minmax(240px, 460px) minmax(280px, 520px); gap: clamp(28px, 5vw, 72px);
             justify-content: center; align-items: center; padding: 20px 0; }
  .np-body .art { box-shadow: 0 40px 80px -30px rgba(0,0,0,.9); border-radius: 12px; }
  .np-t { margin: 0; font: 400 clamp(34px, 4vw, 52px)/1.02 var(--serif); }
  .np-s { color: rgba(244,238,242,.72); margin: 6px 0 22px; font-size: 15px; }
  .np .scrub { color: rgba(244,238,242,.7); margin-bottom: 18px; }
  .np .ctl { justify-content: center; gap: 22px; }
  .np .ctl .ib { width: 48px; height: 48px; }
  .np .ctl .ib svg { width: 28px; height: 28px; }
  .np .pp { width: 64px; height: 64px; }
  .np .pp svg { width: 26px; height: 26px; }
  .np h4 { margin: 28px 0 8px; font-size: 13px; color: rgba(244,238,242,.7); }
  .np .chip { background: rgba(255,255,255,.12); color: var(--text); }
  .np .chip.on { background: var(--brass); color: #231A12; }
  .upnext { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .upnext button { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 8px; }
  .upnext button:hover { background: rgba(255,255,255,.08); }
  .upnext .n, .upnext .d { color: rgba(244,238,242,.6); font-variant-numeric: tabular-nums; }
  .dl { display: inline-flex; margin-top: 18px; color: var(--text); font-weight: 600; text-decoration: none; gap: 6px; align-items: center; opacity: .85; }
  .dl:hover { opacity: 1; }
  .dl svg { width: 16px; height: 16px; }

  /* ── Modal ── */
  .modal { position: fixed; inset: 0; z-index: 30; background: rgba(10,8,12,.6); backdrop-filter: blur(6px); display: grid; place-items: center; padding: 16px; }
  .sheet { width: min(440px, 100%); background: #2A2530; border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: grid; gap: 16px; }
  .sheet h2 { margin: 0; font: 400 30px/1.1 var(--serif); }
  .sheet label { display: grid; gap: 6px; color: var(--dim); font-size: 13px; font-weight: 600; }
  .sheet label.row2 { display: flex; align-items: center; gap: 10px; color: var(--text); font-size: 14px; }
  .field { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; color: var(--text); width: 100%; }
  .sheet .end { display: flex; justify-content: flex-end; gap: 10px; }
  .err { color: var(--brass); margin: 0; font-size: 13px; }

  /* ── Mobile ── */
  .tabs { display: none; }
  @media (max-width: 760px) {
    :root { --sidew: 0px; }
    body { font-size: 15px; }
    .side { display: none; }
    input:not(.edit-title), select { font-size: 16px !important; }
    .edit-title { font-size: 30px; text-align: center; }
    .editbar { position: static; background: none; justify-content: stretch; }
    .editbar .pill { flex: 1; justify-content: center; min-height: 48px; }          /* stops iOS from zooming on focus */
    .tabs { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; justify-content: space-around;
            padding: 6px 0 max(8px, env(safe-area-inset-bottom)); background: rgba(21,19,24,.94);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--line); }
    .tabs button { display: grid; justify-items: center; gap: 2px; min-width: 88px; min-height: 48px; padding: 4px 12px;
                   font-size: 11px; font-weight: 600; color: var(--dim); }
    .tabs button[aria-current="page"] { color: var(--brass); }
    .tabs svg { width: 22px; height: 22px; }
    .share-mode .tabs { display: none; }

    .mini { left: 8px; right: 8px; bottom: calc(70px + env(safe-area-inset-bottom)); grid-template-columns: minmax(0,1fr) auto;
            gap: 8px; padding: 8px 8px 10px; }
    .share-mode .mini { bottom: calc(10px + env(safe-area-inset-bottom)); }
    .mini .scrub, .mini .prev { display: none; }
    .mini .ib { width: 44px; height: 44px; }
    .mini .ctl { gap: 2px; }
    .mprog { display: block; }
    main { padding-bottom: calc(180px + env(safe-area-inset-bottom)); }
    .share-mode main { padding-bottom: calc(110px + env(safe-area-inset-bottom)); }

    .wrap { padding: 0 16px; }
    .libhead { padding-top: 22px; }
    .libhead h1 { font-size: 38px; }
    .search { width: 100%; padding: 10px 12px; }
    .seg { flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px; padding: 6px 16px 4px; scrollbar-width: none; }
    .seg::-webkit-scrollbar { display: none; }
    .seg button { flex: none; min-height: 36px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 20px 14px; }
    .ygroup h2 { font-size: 26px; }

    .back { min-height: 44px; padding-top: 10px; }
    /* compact, centered release header on phones */
    .hero { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 12px; padding-top: 4px; }
    .hero > div { width: 100%; min-width: 0; }
    .hero .artwrap { width: min(230px, 60vw); margin: 0 auto; }
    .hero .art { width: 100%; }
    .hero h1 { font-size: clamp(26px, 8.4vw, 40px); line-height: 1.05; overflow-wrap: normal; margin: 2px 0 4px; }
    .hero h1.squeeze { overflow-wrap: anywhere; }
    .wrap > .eranav { margin-top: 2px; }
    .hero .tagline { margin: 0 auto 6px; font-size: 15px; }
    .hero .flagband { margin: 2px auto 8px !important; }
    .relhead { padding-bottom: 14px; }
    .back { min-height: 40px; padding-top: 6px; }
    .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 12px; }
    .acts .pill { justify-content: center; min-height: 46px; white-space: nowrap; }
    .tools { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; width: 100%; margin-top: 10px; }
    .tools .pill { display: grid; justify-items: center; gap: 3px; padding: 7px 2px; min-height: 56px; border-radius: 14px;
                   font-size: 11px; font-weight: 700; white-space: normal; line-height: 1.15; }
    .tools .pill svg { width: 18px; height: 18px; }
    .row { grid-template-columns: 34px minmax(0,1fr) 44px; gap: 8px; padding: 10px 4px; min-height: 56px; }
    .row .dur { display: none; }
    .row .ib { width: 44px; height: 44px; }
    .idx { width: 34px; height: 44px; }
    .tt { font-size: 15px; padding: 2px 0; }
    .chip { padding: 6px 12px; font-size: 13px; }

    .page-h { font-size: 38px; padding-top: 22px; }
    .link { grid-template-columns: 52px minmax(0,1fr); gap: 10px 12px; padding: 12px; }
    .link .cs.plays, .link .cs.ends { display: none; }
    .link .lmeta { display: block; }
    .link .lctl { grid-column: 1 / -1; justify-content: space-between; }
    .link .lctl .pill { min-height: 44px; }

    .np-in { padding: max(10px, env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom)); }
    .np-top { display: flex; justify-content: center; }
    .np-top .ib { width: 56px; height: 44px; }
    .np-body { grid-template-columns: 1fr; gap: 22px; padding-top: 6px; }
    .np-body .art { width: min(340px, 82vw); justify-self: center; }
    .np-t { font-size: 32px; }
    .np .ctl { gap: 28px; }

    .modal { place-items: end stretch; padding: 0; }
    .sheet { max-height: 92vh; max-height: 92dvh; width: 100%; border-radius: 18px 18px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom)); }
    .sheet .end .pill { flex: 1; justify-content: center; min-height: 48px; }
    .sheet label.row2 { min-height: 44px; }
    .sheet input[type=checkbox] { width: 22px; height: 22px; }
    .job { left: 8px; right: 8px; bottom: calc(146px + env(safe-area-inset-bottom)); }
    .share-mode .job { bottom: calc(86px + env(safe-area-inset-bottom)); }
    .toast { bottom: calc(150px + env(safe-area-inset-bottom)); }
    .dgrid { grid-template-columns: 1fr; }
    .recent { grid-template-columns: 1fr; }
  }
  .lmeta { display: none; color: var(--dim); font-size: 12px; margin-top: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* ═════════ Kenyan theme: black base, red actions, green "on" states, white flag edging ═════════ */
  :root {
    --bg: #0B0B0C; --side: #070707; --raise: rgba(255,255,255,.06); --hover: rgba(255,255,255,.1);
    --line: rgba(255,255,255,.08); --text: #F6F3EF; --dim: #A8A2A0;
    --red: #D21034; --red-hi: #F0304F; --red-lo: #8C0A20;
    --green: #087A3B; --green-hi: #34C27A;   /* #087A3B keeps white text at 5.4:1 */
    --brass: #34C27A;
    --tint: #2A1216;
    --serif: 'Sora', 'Manrope', system-ui, sans-serif;
    --r-art: 16px; --r-ui: 14px;
    --flag: linear-gradient(180deg, #000 0 22%, #fff 22% 30%, var(--red) 30% 70%, #fff 70% 78%, var(--green) 78% 100%);
  }
  body { background: radial-gradient(1200px 600px at 85% -10%, rgba(210,16,52,.14), transparent 60%),
                      radial-gradient(900px 500px at -10% 110%, rgba(11,143,69,.12), transparent 60%), var(--bg);
         background-attachment: fixed; }
  .flagband { display: block; height: 7px; width: 64px; border-radius: 4px; background: var(--flag); box-shadow: 0 0 0 1px rgba(255,255,255,.08); }
  .brand { font: 800 22px/1 var(--serif); letter-spacing: .06em; text-transform: uppercase; display: grid; gap: 10px; }
  .brand span { color: var(--red-hi); }
  .side .brand { display: block; white-space: nowrap; }
  .side .brand .flagband { margin-top: 12px; }
  .home-h .brand { padding: 0; white-space: nowrap; }
  .nav[aria-current="page"] { background: linear-gradient(90deg, rgba(210,16,52,.22), rgba(210,16,52,.04)); color: var(--text); box-shadow: inset 3px 0 0 var(--red); }
  .page-h, .libhead h1, .hero h1, .np-t, .sheet h2, .ygroup h2 { font-family: var(--serif); letter-spacing: -.01em; }
  .page-h { font-weight: 300; }
  .page-h b, .sh b { font-weight: 800; }
  .hero h1 { font-weight: 800; }
  .np-t { font-weight: 700; }
  .sheet h2 { font-weight: 700; font-size: 26px; }
  .ygroup h2 { font-weight: 700; color: var(--text); font-size: 22px; }
  .pill.main, .pp { background: linear-gradient(135deg, var(--red-hi), var(--red) 55%, var(--red-lo)); color: #fff; box-shadow: 0 10px 24px -12px rgba(210,16,52,.9); }
  .pp svg { color: #fff; }
  .pill.soft { background: rgba(255,255,255,.08); }
  input[type=range] { background: linear-gradient(90deg, var(--red-hi) var(--p, 0%), rgba(255,255,255,.18) var(--p, 0%)); }
  .mprog i, .bar i { background: linear-gradient(90deg, var(--red), var(--red-hi)); }
  .scrub .marks i { background: var(--red-hi); box-shadow: 0 0 0 2px rgba(0,0,0,.6); }
  .chip.on, .np .chip.on { background: var(--green); color: #fff; }
  .seg button[aria-pressed="true"] { background: var(--text); color: #0B0B0C; }
  .tog input:checked + span { background: var(--green); }
  .eq i { background: var(--green-hi); }
  .clist .when { color: var(--green-hi); }
  .search { border-radius: 16px; background: rgba(255,255,255,.07); border: 1px solid var(--line); }
  .art { border-radius: var(--r-art); }
  .home-h { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 26px 0 16px; }
  .hello { color: var(--dim); font-size: 13px; font-weight: 600; letter-spacing: .02em; }
  .home-h .brand { font-size: 24px; margin-top: 4px; display: block; }
  .hbtns { display: flex; gap: 10px; }
  .round { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.06); border: 1px solid var(--line); color: var(--text); }
  .round svg { width: 19px; height: 19px; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 800 14px var(--serif); color: #fff;
            background: conic-gradient(from 200deg, var(--red), #000 30%, var(--green) 60%, var(--red)); box-shadow: 0 0 0 2px rgba(255,255,255,.85) inset, 0 0 0 1px #000; }
  .search.big { width: 100%; padding: 13px 16px; }
  .carousel { position: relative; margin: 22px 0 6px; }
  .ctrack { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 4px; }
  .ctrack::-webkit-scrollbar { display: none; }
  .slide { position: relative; flex: 0 0 min(560px, 86%); aspect-ratio: 16 / 10; border-radius: 22px; overflow: hidden; scroll-snap-align: start;
           background: #151515; box-shadow: 0 24px 50px -28px #000; }
  .slide img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .slide::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,.8) 88%),
                  linear-gradient(90deg, rgba(210,16,52,.28), transparent 45%); }
  .slide .tag { position: absolute; top: 14px; left: 14px; z-index: 1; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700;
                padding: 5px 11px; border-radius: 999px; background: rgba(0,0,0,.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .slide .tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--green-hi); }
  .slide .cap { position: absolute; left: 18px; right: 76px; bottom: 16px; z-index: 1; display: grid; gap: 4px; }
  .slide .yr { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: rgba(255,255,255,.8); text-transform: uppercase; }
  .slide .ttl { font: 800 clamp(24px, 4.2vw, 40px)/1.02 var(--serif); letter-spacing: -.01em; text-shadow: 0 2px 20px rgba(0,0,0,.5); overflow-wrap: anywhere; }
  .slide .go { position: absolute; right: 16px; bottom: 16px; z-index: 1; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
               background: linear-gradient(135deg, var(--red-hi), var(--red)); color: #fff; box-shadow: 0 10px 22px -10px rgba(210,16,52,.9); }
  .slide .go svg { width: 18px; height: 18px; }
  .dots { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
  .dots button { width: 7px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.3); transition: width .25s, background .25s; }
  .dots button[aria-current="true"] { width: 22px; background: var(--red-hi); }
  .sh { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 28px 0 12px; font: 400 20px/1.1 var(--serif); scroll-margin-top: 12px; }
  .seeall { font: 700 12px var(--sans); color: var(--red-hi); letter-spacing: .02em; min-height: 32px; }
  .hrow { display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none; padding-bottom: 6px; scroll-snap-type: x proximity; }
  .hrow::-webkit-scrollbar { display: none; }
  .recent { display: flex; gap: 14px; grid-template-columns: none; }
  .rc { flex: 0 0 132px; display: grid; gap: 4px; padding: 0; background: none; scroll-snap-align: start; grid-template-columns: none; align-content: start; }
  .rc:hover { background: none; }
  .rc .art { width: 132px; height: 132px; border-radius: 16px; margin-bottom: 4px; }
  .rc .ct { font-weight: 700; font-size: 14px; }
  .circ { flex: 0 0 118px; display: grid; justify-items: center; gap: 6px; text-align: center; scroll-snap-align: start; }
  .circ .ring { width: 108px; height: 108px; border-radius: 50%; padding: 3px; background: conic-gradient(var(--red), #000 33%, var(--green) 66%, var(--red)); }
  .circ .art { width: 100%; height: 100%; border-radius: 50%; border: 3px solid #000; }
  .circ .ct { font-weight: 700; font-size: 13px; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .circ .cs { font-size: 12px; }
  .vh { display: flex; align-items: center; justify-content: space-between; padding: 26px 0 6px; }
  .vsub { color: var(--dim); font-size: 13px; font-weight: 600; margin: 18px 0 12px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
  .tile { position: relative; display: grid; justify-items: center; gap: 8px; padding: 26px 14px 20px; border-radius: 20px; text-align: center;
          background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03)); border: 1px solid var(--line); overflow: hidden; }
  .tile::before { content: ''; position: absolute; top: 0; left: 18px; right: 18px; height: 5px; border-radius: 0 0 4px 4px; background: var(--flag); }
  .tile:hover { background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.04)); }
  .tile .ic { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.5); border: 1px solid var(--line); }
  .tile .ic svg { width: 21px; height: 21px; }
  .tile.r .ic { color: var(--red-hi); } .tile.g .ic { color: var(--green-hi); }
  .tile strong { font: 700 16px var(--serif); }
  .tile span { color: var(--dim); font-size: 12px; }
  .acts-list { list-style: none; margin: 0; padding: 0; }
  .acts-list button { display: grid; grid-template-columns: 26px 1fr auto; gap: 14px; align-items: center; width: 100%; min-height: 56px; padding: 8px 4px;
                      border-bottom: 1px solid var(--line); font-weight: 600; }
  .acts-list button:hover { color: var(--red-hi); }
  .acts-list svg { width: 20px; height: 20px; color: var(--dim); }
  .mini { z-index: 12; border-radius: 18px; background: rgba(22,22,24,.88); border: 1px solid rgba(255,255,255,.1); overflow: hidden; }
  .mini::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px;
                  background: linear-gradient(90deg, #000 0 32%, #fff 32% 34%, var(--red) 34% 66%, #fff 66% 68%, var(--green) 68%); }
  .mini .art { border-radius: 10px; }
  @media (max-width: 760px) {
    .tabs { align-items: flex-end; padding-top: 8px; background: rgba(10,10,11,.95); }
    .tabs button { min-width: 60px; padding: 4px 4px; }
    .tabs button[aria-current="page"] { color: var(--red-hi); }
    .tabs .homebtn { position: relative; margin-top: -30px; width: 62px; height: 62px; min-width: 62px; border-radius: 50%; place-items: center; align-content: center; padding: 0;
                     color: #fff; background: linear-gradient(135deg, var(--red-hi), var(--red) 55%, var(--red-lo));
                     box-shadow: 0 0 0 5px #0A0A0B, 0 0 0 7px rgba(255,255,255,.9), 0 0 0 10px var(--green), 0 14px 30px -8px rgba(210,16,52,.9); }
    .tabs .homebtn[aria-current="page"] { color: #fff; }
    .tabs .homebtn svg { width: 26px; height: 26px; }
    .tabs .homebtn span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .home-h { padding-top: 18px; }
    .slide { flex-basis: 88%; aspect-ratio: 4 / 5; }
    .hero .flagband { margin-left: auto !important; margin-right: auto !important; }
    .tiles { grid-template-columns: 1fr 1fr; gap: 12px; }
    .rc { flex-basis: 120px; } .rc .art { width: 120px; height: 120px; }
  }

  /* ═════════ Fan club, worlds, videos ═════════ */
  .clubtag { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: .04em;
             text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--red), var(--red-lo)); box-shadow: 0 0 0 1px rgba(255,255,255,.2) inset; }
  .clubtag svg { width: 13px; height: 13px; color: #fff; }
  .side-tag { margin: 0 12px 18px; }
  .tagline { margin: 0 0 12px; font: 400 17px/1.4 var(--serif); color: rgba(246,243,239,.88); max-width: 46ch; }
  .vbadge { display: inline-flex; align-items: center; gap: 4px; margin-left: 8px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 800;
            color: #fff; background: rgba(210,16,52,.85); vertical-align: middle; }
  .vbadge svg { width: 12px; height: 12px; }
  .row .tt { display: inline; width: auto; }
  .cnote { margin: 0; font-size: 12px; }
  .plink { color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
  .relhide { display: flex; gap: 10px; align-items: center; margin: 6px 0 10px; font-weight: 600; color: var(--text); min-height: 44px; }
  .relhide input { width: 20px; height: 20px; accent-color: var(--green); }
  .wmoods { display: flex; flex-wrap: wrap; gap: 6px; }
  .wmoods i { font-style: normal; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.2); }
  .story { margin-top: 12px; max-height: 7.5em; overflow: hidden; position: relative; font-size: 15px; line-height: 1.6; color: rgba(246,243,239,.9); max-width: 68ch; }
  .story p { margin: 0 0 12px; }
  .story:not(.open)::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3em; background: linear-gradient(transparent, rgba(12,12,13,.95)); }
  .story.open { max-height: none; }
  .sheet.wide { width: min(620px, 100%); }
  .sheet { max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow-y: auto; overscroll-behavior: contain; }
  .colorrow { display: flex; gap: 12px; align-items: center; }
  .colorrow input[type=color] { width: 56px; height: 40px; border: 1px solid var(--line); border-radius: 10px; background: none; padding: 2px; }
  .clubcta { display: flex; gap: 16px; align-items: center; justify-content: space-between; margin: 0 0 18px; padding: 16px 18px; border-radius: 18px;
             background: linear-gradient(135deg, rgba(210,16,52,.18), rgba(11,143,69,.12)); border: 1px solid var(--line); }
  .clubcta strong { display: block; font: 700 17px var(--serif); margin-bottom: 4px; }
  .clubcta .cs { display: block; max-width: 60ch; }
  .clubart { display: grid; place-items: center; color: #fff; aspect-ratio: 1; background: var(--flag); }
  .clubart svg { width: 20px; height: 20px; filter: drop-shadow(0 1px 2px #000); }
  .npmedia { position: relative; display: grid; gap: 12px; }
  .npmode { justify-self: center; display: inline-flex; padding: 4px; border-radius: 999px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.14); }

}

// The name a release came out under ("Released as"): set in Release page, otherwise read from the song file names.
const HOME_NAME = 'Nicólas Soul';
const isHomeName = n => /nic[oó]las\s*soul/i.test(String(n || ''));
function relArtist(r) {
  if (!r) return HOME_NAME;
  if (String(r.artist_name || '').trim()) return String(r.artist_name).trim();
  S.nameCache = S.nameCache || {};
  if (S.nameCache[r.release_id]) return S.nameCache[r.release_id];
  const ts = S.lib.tracks.filter(t => t.release_id === r.release_id);
  const counts = {};
  ts.forEach(t => { const a = String(t.artist || '').trim(); if (a && !/nurenaissance/i.test(a)) counts[a] = (counts[a] || 0) + 1; });
  const names = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  let out = HOME_NAME;
  if (names.length && counts[names[0]] >= ts.length / 2) out = isHomeName(names[0]) ? HOME_NAME : names[0];
  else if (names.length >= 3) out = 'Various artists';
  return (S.nameCache[r.release_id] = out);
}
// A song's own artist is only worth showing when it differs from the release's name (features, compilations).
// Song artist: shown only when it differs from the project artist (a Nicólas Soul song on a LyriCal project shows).
const artistOf = t => {
  const a = String(t.artist || '').trim();
  if (!a || /nurenaissance/i.test(a)) return '';
  const pa = relArtist(rel(t.release_id));
  const same = a.toLowerCase() === pa.toLowerCase() || (isHomeName(a) && isHomeName(pa));
  return same ? '' : a;
};

async function init() {

  $$('[data-ctl="close"]').forEach(b => b.innerHTML = I.down);
  setToggle(false);
  watchStall();
  try {
    if (BOOT.token) {
      const cached = libCacheGet();
      const show = d => { if (CLUB()) { document.body.classList.add('club-mode'); renderChrome(); renderLibrary(); }
                          else { document.body.classList.add('share-mode'); renderRelease(d.releases[0].release_id); } };
      if (cached && cached.releases && cached.releases.length) { S.lib = normalizeLib(cached); S.share = cached.share; primeThumbs(); S.streamKey = cached.stream_key || ''; S.stale = true; show(cached); }
      let d;
      try { d = await firstCall('getShare', BOOT.token); } catch (e) { if (cached) { S.stale = false; toast("Couldn't refresh. Showing your last copy."); return; } throw e; }
      if (d.error) { libCacheClear(); document.body.classList.add('share-mode'); return empty(d.error); }
      S.lib = normalizeLib(d); S.share = d.share; primeThumbs(); S.streamKey = d.stream_key || ''; S.stale = false; libCacheSet(d);
      if (!d.releases.length) { document.body.classList.add('share-mode'); return empty('There is nothing to play on this link yet.'); }
      if (cached) refreshView(); else show(d);
    } else if (BOOT.key) {
      const cached = libCacheGet();
      if (cached) { S.lib = normalizeLib(cached); primeThumbs(); S.streamKey = cached.stream_key || ''; S.stale = true; renderChrome(); renderLibrary(); }
      let d;
      try { d = await firstCall('getLibrary', BOOT.key); } catch (e) { if (cached) { S.stale = false; toast("Couldn't refresh. Showing your last copy."); return; } throw e; }
      S.lib = normalizeLib(d); primeThumbs(); S.streamKey = S.lib.stream_key || ''; S.stale = false; libCacheSet(d);
      if (cached) refreshView(); else { renderChrome(); renderLibrary(); }
    } else {
      empty('Open this page from your owner link, or from a share link someone sent you.');
    }
  } catch (e) { empty('Soul Vault could not load: ' + (e.message || String(e)), true); }
  clearTimeout(watchStall.t);
}

// Small covers first; full-size (or animated) art only as each card comes into view.
function wireShelf() {
  const tr = $('#ctrack'); if (!tr) return;
  const imgs = [...tr.querySelectorAll('img[data-shelf-cover]')];
  imgs.forEach(img => setCover(img, img.dataset.shelfCover, false));
  if (S.shelfObs) S.shelfObs.disconnect();
  if ('IntersectionObserver' in window) {
    S.shelfObs = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { S.shelfObs.unobserve(e.target); setCover(e.target, e.target.dataset.shelfCover, true); }
    }), { root: tr, rootMargin: '0px 60% 0px 60%' });
    imgs.forEach(i => S.shelfObs.observe(i));
  } else imgs.slice(0, 3).forEach(img => setCover(img, img.dataset.shelfCover, true));
  const step = () => (tr.firstElementChild ? tr.firstElementChild.getBoundingClientRect().width + 14 : 1);
  const pos = () => {
    const i = Math.min(imgs.length, Math.round(tr.scrollLeft / step()) + 1);
    const el = $('#shelfPos'); if (el) el.textContent = `${i} of ${imgs.length}`;
    S.shelfLeft = tr.scrollLeft;
  };
  tr.addEventListener('scroll', () => { clearTimeout(tr._t); tr._t = setTimeout(pos, 80); }, { passive: true });
  if (S.shelfLeft) { tr.scrollLeft = S.shelfLeft; pos(); }
  S.shelfStep = step;
}
function shelfGo(dir) {
  const tr = $('#ctrack'); if (!tr) return;
  const per = Math.max(1, Math.floor(tr.clientWidth / S.shelfStep()));

/* ── change cover ── */
function shrinkImage(file, max, quality) {
  max = max || 1600; quality = quality || 0.9;
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That file could not be read as an image. Use a JPG or PNG.')); };
    img.src = url;
  });
}
async function changeCover(file) {
  const id = S.releaseId, r = rel(id), btn = $('[data-cover-change]');
  if (btn) { btn.classList.add('busy'); btn.querySelector('span').textContent = 'Uploading…'; }
  try {
    if (file.type === 'image/gif') {
      await uploadGifCover(file, id);
      if (S.view === 'release' && S.releaseId === id) renderRelease(id);
      if (S.now && S.now.r.release_id === id) updateNowUI();
      return;
    }
    const data = await shrinkImage(file);
    let thumb = await shrinkImage(file, 320, 0.72);
    if (thumb.length > 44000) thumb = await shrinkImage(file, 240, 0.6);
    const out = await run('uploadCover', BOOT.key, id, data, thumb);
    r.cover_file_id = out.fileId; r.cover_thumb = out.thumb || ''; r.cover_type = '';
    S.covers[out.fileId] = out.thumb || data; S.covers[out.fileId + '|f'] = data;
    S.coverP[out.fileId] = Promise.resolve(out.thumb || data); S.coverP[out.fileId + '|f'] = Promise.resolve(data);
    if (S.view === 'release' && S.releaseId === id) renderRelease(id);
    if (S.now && S.now.r.release_id === id) updateNowUI();
  } catch (e) {
    if (btn) { btn.classList.remove('busy'); btn.querySelector('span').innerHTML = I.img + 'Change cover'; }
    alert(e.message || 'The cover could not be uploaded.');
  }
}

function setCover(img, id, full, done) {

function tintFrom(img) {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 24;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0, 24, 24);
    const d = x.getImageData(0, 0, 24, 24).data;
    let r = 0, g = 0, b = 0, w = 0;
    for (let i = 0; i < d.length; i += 4) {
      const mx = Math.max(d[i], d[i + 1], d[i + 2]), mn = Math.min(d[i], d[i + 1], d[i + 2]);
      const wt = 1 + (mx - mn) / 40;                    // favor colorful pixels over grey
      r += d[i] * wt; g += d[i + 1] * wt; b += d[i + 2] * wt; w += wt;
    }
    r /= w; g /= w; b /= w;
    const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    const f = lum ? Math.min(1.4, 72 / lum) : 1;         // settle every cover to a similar, text-safe darkness
    const hex = [r, g, b].map(v => Math.round(Math.min(255, v * f)).toString(16).padStart(2, '0')).join('');
    const head = $('#relhead'); if (head) head.style.setProperty('--tint', '#' + hex);
  } catch (e) {}
}

async function sourceFor(fid, allowDirect, force) {
  const d = allowDirect ? directUrl(fid) : '';
  if (d) return { stream: d, download: 'https://drive.google.com/uc?export=download&id=' + encodeURIComponent(fid), viaApi: true, direct: true };
  const src = await run('prepareAudio', fid, BOOT.key, BOOT.token, !!force);
  if (src.viaApi) { S.pub = S.pub || {}; S.pub[fid] = true; }

async function play(vid) {
  listenEnd(false);   // the song being replaced: count it as a play or a skip
  const v = S.lib.versions.find(x => x.version_id === vid);
  if (!v) return;
  const t = trk(v.track_id), r = rel(t.release_id);
  S.now = { v, t, r, dl: '' };
  $('#mini').hidden = false;
  // iPhones only allow sound that starts inside the tap itself, so start a silent clip now
  // and swap in the real file when Drive is ready.
  if (!unlocked) { audio.src = SILENT; audio.play().then(() => (unlocked = true)).catch(() => {}); }
  updateNowUI();
  audio.pause();
  const wasYt = S.ytSong; S.ytSong = isYtSong(v);
  if (S.ytSong) {   // no audio file: the YouTube video is the song
    msg(''); recordRecent(t); openNp(); setMode('video'); ytHello(); $('#npMode').hidden = true; return;
  }
  if (wasYt && S.videoMode) setMode('song');
  msg('Loading…');
  if (!S.streamKey && S.lib.stream_key) S.streamKey = S.lib.stream_key;
  warmRelease(r.release_id);
  try {
    const fid = v.preview || v.audio;
    let src = await sourceFor(fid, true);
    if (S.now.v !== v) return;
    S.viaApi = src.viaApi;
    S.directTry = !!src.direct;              // a direct address that fails is retried quietly below
    audio.src = src.stream;
    if (S.videoMode && videoOf(t)) { S.directTry = false; msg(''); recordRecent(t); return; }   // watching the video: keep the song ready but silent
    try { await audio.play(); S.directTry = false; }
    catch (e) {
      if (e && e.name === 'NotAllowedError') { msg('Tap play to start.'); setToggle(false); return; }
      // Don't give up: fresh re-share of this file → the other file (preview ↔ original) → one more try after a moment.
      delete S.pub[fid];
      const alt = fid === v.preview ? v.audio : (v.preview && fid !== v.preview ? v.preview : '');
      const attempts = [[fid, false, true], ...(alt ? [[alt, true, false], [alt, false, true]] : []), [fid, false, true, 1200]];
      let played = false, lastErr = null;
      for (const [f, direct, force, wait] of attempts) {
        if (wait) await new Promise(r => setTimeout(r, wait));
        if (S.now.v !== v) return;
        try { src = await sourceFor(f, direct, force); if (S.now.v !== v) return; audio.src = src.stream; await audio.play(); played = true; break; }
        catch (e2) { lastErr = e2; if (e2 && e2.name === 'NotAllowedError') break; }
      }
      S.directTry = false;
      if (!played) {
        if (lastErr && lastErr.name === 'NotAllowedError') { msg('Tap play to start.'); setToggle(false); return; }
        showAudioProblem(src && src.stream, v); return;
      }
    }
    preloadNext();
    msg('');
    recordRecent(t);
    if (BOOT.token && !S.played[vid]) { S.played[vid] = 1; run('recordPlay', BOOT.token).catch(() => {}); }
    if (OWNER || (S.share && S.share.allow_download)) {
      const dl = (v.preview ? await sourceFor(v.audio, true) : src).download;
      if (S.now.v === v) { S.now.dl = dl; updateNowUI(); }
    }
  } catch (e) {
    msg(e && e.message ? e.message : 'This file could not be played. Files over 100 MB may not stream from Drive.');
  }
}

function releaseQueue(relId) {

function playFromTap(vid) {

    const q = plQueue(plOf(S.plId)), i = q.findIndex(x => ver(x).track_id === v.track_id);
    if (i > -1) { q[i] = vid; playQueue(q, i); return; }
  }
  if (S.now && S.queue[S.qi] && ver(S.queue[S.qi]) && ver(S.queue[S.qi]).track_id === v.track_id) {

async function driveUpload(blob, name, mime, ticket, onProg) {
  const init = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + ticket.token, 'Content-Type': 'application/json; charset=UTF-8',
               'X-Upload-Content-Type': mime, 'X-Upload-Content-Length': String(blob.size) },
    body: JSON.stringify({ name: name, parents: [ticket.folderId] })
  });
  if (!init.ok) throw new Error('Drive refused the upload (' + init.status + '). Reload the page and try again.');
  const loc = init.headers.get('Location');
  if (!loc) throw new Error('Drive did not return an upload address.');
  const CH = 8 * 1024 * 1024;
  let off = 0, tries = 0;
  while (off < blob.size) {
    const end = Math.min(off + CH, blob.size);
    let r;
    try { r = await fetch(loc, { method: 'PUT', headers: { 'Content-Range': `bytes ${off}-${end - 1}/${blob.size}` }, body: blob.slice(off, end) }); }
    catch (e) { if (++tries > 3) throw new Error('The connection dropped during upload.'); await new Promise(z => setTimeout(z, 1500 * tries)); continue; }
    if (r.status === 308) {
      const range = r.headers.get('Range');
      off = range ? +range.split('-')[1] + 1 : end; tries = 0;
      onProg && onProg(off / blob.size);
    } else if (r.ok) {
      onProg && onProg(1);
      return (await r.json()).id;
    } else if (r.status >= 500 && ++tries <= 3) {
      await new Promise(z => setTimeout(z, 1500 * tries));
    } else {
      throw new Error('Upload failed (' + r.status + ').');
    }
  }
  throw new Error('Upload ended without a file.');
}

let lameP = null;
function loadLame() {
  if (window.lamejs) return Promise.resolve(window.lamejs);
  return lameP || (lameP = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js';
    s.onload = () => res(window.lamejs);
    s.onerror = () => { lameP = null; rej(new Error('Could not load the MP3 encoder. Check your connection.')); };
    document.head.appendChild(s);
  }));
}
// Decodes any browser-readable audio and returns a 160 kbps MP3 blob.
async function toMp3(arrayBuffer, onProg) {
  const lame = await loadLame();
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  let buf;
  try { buf = await new Promise((res, rej) => ctx.decodeAudioData(arrayBuffer, res, rej)); }
  catch (e) { throw new Error('This browser could not read that audio file.'); }
  finally { try { ctx.close(); } catch (e) {} }
  const ch = Math.min(2, buf.numberOfChannels), L = buf.getChannelData(0), R = ch > 1 ? buf.getChannelData(1) : null;
  const enc = new lame.Mp3Encoder(ch, buf.sampleRate, 160), out = [], block = 1152;
  const l16 = new Int16Array(block), r16 = new Int16Array(block);
  const fill = (src, dst, i, n) => { for (let k = 0; k < n; k++) { let x = src[i + k]; x = x < -1 ? -1 : x > 1 ? 1 : x; dst[k] = x < 0 ? x * 0x8000 : x * 0x7FFF; } };
  for (let i = 0, b = 0; i < L.length; i += block, b++) {
    const n = Math.min(block, L.length - i);
    fill(L, l16, i, n); if (R) fill(R, r16, i, n);
    const d = R ? enc.encodeBuffer(l16.subarray(0, n), r16.subarray(0, n)) : enc.encodeBuffer(l16.subarray(0, n));
    if (d.length) out.push(new Uint8Array(d));
    if (b % 300 === 0) { onProg && onProg(i / L.length); await new Promise(z => setTimeout(z, 0)); }
  }
  const f = enc.flush(); if (f.length) out.push(new Uint8Array(f));
  return { blob: new Blob(out, { type: 'audio/mpeg' }), duration: buf.duration };
}

async function makePreviews(relId) {

  const todo = previewTodo(relId);
  if (!todo.length) return;
  S.jobBusy = true;
  let done = 0, failed = 0;
  for (const v of todo) {
    const t = trk(v.track_id);

      const src = await run('prepareAudio', v.audio, BOOT.key, '');
      if (!src.viaApi) throw new Error('Add drive_api_key in Settings first.');
      const resp = await fetch(src.stream);
      if (!resp.ok) throw new Error('Drive returned ' + resp.status);
      const ab = await resp.arrayBuffer();
      jobShow('Converting ' + t.title, 0.2, label);
      const mp3 = await toMp3(ab, p => jobShow('Converting ' + t.title, 0.2 + p * 0.5, label));
      const ticket = await run('getUploadTicket', BOOT.key, relId);
      jobShow('Uploading preview for ' + t.title, 0.7, label);

      v.preview = id; done++;

      failed++;

    }
  }
  S.jobBusy = false;
  jobShow(`Previews done: ${done} made${failed ? ', ' + failed + ' could not be converted' : ''}.`, 1, '');
  setTimeout(jobHide, 5000);

const isLocked = r => !!(r && r.unlock_at && new Date(r.unlock_at) > new Date());
const EXCL = /(demo|draft|rough|mix\s*v?\d|^v\d|\balt\b|alternate|a\s?c+ap+el+a|instrumental|live|stage|slowed|reverb|sped|snippet|unreleased|idea|voice memo)/i;
const isExclusive = v => !!(v && EXCL.test(String(v.label || '')));
const pad3 = n => String(n).padStart(3, '0');
function until(ms) {
  if (ms <= 0) return 'Opening…';
  const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4), s = Math.floor(ms % 6e4 / 1e3);
  return (d ? d + 'd ' : '') + String(h).padStart(2, '0') + 'h ' + String(m).padStart(2, '0') + 'm ' + String(s).padStart(2, '0') + 's';
}
const whenLabel = iso => new Date(iso).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
function localInput(iso) {
  if (!iso) return '';
  const d = new Date(iso); if (isNaN(d)) return '';
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
const paras = t => String(t || '').trim().split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('');

/* countdowns: one ticker for every [data-unlock] on screen */
function tick() {
  const now = Date.now(); let due = false;
  $$('[data-unlock]').forEach(el => { const ms = new Date(el.dataset.unlock) - now; el.textContent = until(ms); if (ms <= 0) due = true; });
  if (due && !OWNER && BOOT.token && !S.refreshing && now - (S.lastRefresh || 0) > 15000) refreshClub();
}
setInterval(tick, 1000);
async function refreshClub() {
  S.refreshing = true; S.lastRefresh = Date.now();
  await new Promise(z => setTimeout(z, 3000));   // give the server a moment past the unlock time
  try {
    const d = await run('getShare', BOOT.token);
    if (!d.error) {
      S.lib = normalizeLib(d); S.share = d.share; primeThumbs(); libCacheSet(d);
      if (S.view === 'release') renderRelease(S.releaseId); else renderLibrary();

}

function nrAdd(files) {
  const skipped = [];
  files.forEach(f => {
    if (!AUDIO_OK.test(f.name) && !/^audio\//.test(f.type)) { skipped.push(f.name); return; }

    S.nr.files.push({ file: f, title: niceTitle(f.name), state: '' });
  });
  nrRender();
  if (skipped.length) toast('Skipped (not audio): ' + skipped.slice(0, 2).join(', ') + (skipped.length > 2 ? '…' : ''));
}

}
async function doNewRelease(btn) {
  const err = $('#nrErr'), fail = m => { err.hidden = false; err.textContent = m; };
  err.hidden = true;
  const title = $('#nrTitle').value.trim(), type = $('#nrType').value, year = +$('#nrYear').value;
  const picked = [...$$('[name="nrVis"]')].find(x => x.checked);
  const vis = picked ? picked.value : 'show';
  const sealAt = $('#nrSeal').value ? new Date($('#nrSeal').value) : null;
  if (!title) return fail('Give the release a title.');
  if (!(year >= 1990 && year <= 2100)) return fail('Year should look like ' + new Date().getFullYear() + '.');
  if (!S.nr.files.length) return fail('Add at least one song.');
  if (S.nr.files.some(x => !x.title.trim())) return fail('Every song needs a title.');
  if (vis === 'seal' && !(sealAt && sealAt > new Date())) return fail('Pick a future date and time to seal it until.');
  S.nr.busy = true; btn.disabled = true; btn.textContent = 'Uploading…';
  $$('#modal .nrtop input, #modal .nrtop select, #modal .nrtop button, #nrCancel, [data-nr-add], #nrPrev, [name="nrVis"], #nrSeal').forEach(el => (el.disabled = true));
  nrRender();
  $('#nrProg').hidden = false;
  const stat = t => ($('#nrStat').textContent = t), bar = p => $('#nrBar').style.setProperty('--p', Math.round(p * 100) + '%');
  const n = S.nr.files.length, failed = [];
  let r;
  try {
    stat('Creating the release…');
    r = await run('createRelease', BOOT.key, { title, type, year });
    S.lib.releases.push(r);
    if (S.nr.cover && S.nr.cover.type === 'image/gif') {
      stat('Uploading the animated cover…');
      try { await uploadGifCover(S.nr.cover, r.release_id); } catch (e) { failed.push('the cover'); }
    } else if (S.nr.cover) {
      stat('Uploading the cover…');
      const data = await shrinkImage(S.nr.cover);
      let thumb = await shrinkImage(S.nr.cover, 320, 0.72); if (thumb.length > 44000) thumb = await shrinkImage(S.nr.cover, 240, 0.6);
      try {
        const out = await run('uploadCover', BOOT.key, r.release_id, data, thumb);
        r.cover_file_id = out.fileId; r.cover_thumb = out.thumb || '';
        S.covers[out.fileId] = out.thumb || data; S.covers[out.fileId + '|f'] = data;
        S.coverP[out.fileId] = Promise.resolve(out.thumb || data); S.coverP[out.fileId + '|f'] = Promise.resolve(data);
      } catch (e) { failed.push('the cover'); }
    }
    const wantPrev = $('#nrPrev').checked;
    for (let i = 0; i < n; i++) {
      const x = S.nr.files[i], at = p => bar((i + p) / n), label = `${i + 1} of ${n}: ${x.title}`;
      try {
        let preview = null, duration = null;
        if (wantPrev && LOSSLESS.test(x.file.name)) {
          x.state = 'Making preview'; nrRender(); stat('Making preview, ' + label);
          const mp3 = await toMp3(await x.file.arrayBuffer(), p => at(p * 0.3)); preview = mp3.blob; duration = mp3.duration;
        }
        x.state = 'Uploading'; nrRender(); stat('Uploading ' + label);
        const ticket = await run('getUploadTicket', BOOT.key, r.release_id);
        const base = preview ? 0.3 : 0, span = preview ? 0.6 : 0.9;
        const fileId = await driveUpload(x.file, x.file.name, x.file.type || 'audio/wav', ticket, p => at(base + p * span));
        let previewId = '';
        if (preview) previewId = await driveUpload(preview, x.file.name.replace(/\.[^.]+$/, '') + ' (preview).mp3', 'audio/mpeg', ticket, p => at(0.9 + p * 0.05));

  return i > -1 ? parts[i + 1] || null : null;
}
// Called when the queue runs out. Returns true if a series transition took over.
function maybeSeriesTransition() {

  const r = rel(n.t.release_id), nx = r && nextPart(r); if (!nx) return false;
  const sealed = !OWNER && nx.locked;

  showSeriesTransition(r, nx, sealed);

}

}

/* ── continue where you left off (saved on this device) ── */
const resumeKey = () => recentKey() + ':resume';
function saveResume(force) {
  const n = S.now; if (!n || audio.src === SILENT || !audio.duration) return;
  if (!force && Date.now() - (S.resumeSaved || 0) < 5000) return;
  S.resumeSaved = Date.now();
  const t = audio.currentTime, left = audio.duration - t;
  const last = S.qi >= S.queue.length - 1;
  if (last && left < 15) { ls.set(resumeKey(), null); return; }   // finished everything: nothing to resume
  // nearly done with this song: resume at the start of the next one instead of replaying the ending
  const qi = left < 15 ? S.qi + 1 : S.qi;
  ls.set(resumeKey(), { q: S.queue.slice(0, 200), qi, t: left < 15 ? 0 : Math.max(0, t - 2), vid: S.queue[qi], at: Date.now() });
}
function resumeState() {
  const r = ls.get(resumeKey(), null);
  if (!r || !r.q || !r.q.length) return null;
  const v = ver(r.q[r.qi]); if (!v) return null;
  const t = trk(v.track_id); if (!t || hidden(t)) return null;
  if (Date.now() - (r.at || 0) > 60 * 864e5) return null;   // older than 60 days: let it go
  return Object.assign(r, { v, tr: t, rl: rel(t.release_id) });
}
function resumeCard() {
  const r = resumeState(); if (!r || (S.now && S.now.v.version_id === r.v.version_id)) return '';
  const total = durSecs(r.v.duration), pct = total ? Math.min(100, Math.round(r.t / total * 100)) : 0;
  return `<section class="resume" aria-label="Continue listening">

    <div style="min-width:0"><div class="k">Continue listening</div><div class="t">${esc(r.tr.title)}</div>

      ${pct ? `<div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>` : ''}</div>
    <div class="go2"><button class="pill main" data-resume>${I.play}Resume</button>

}

/* ── counting plays (sent in small batches) ── */
const LQ_KEY = 'sv_listen_queue';
function deviceId() {
  let id = ls.get('sv_device', '');
  if (!id) { id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + '-' + Math.random().toString(36).slice(2)); ls.set('sv_device', id); }
  return id;
}
function listenStart() {
  const n = S.now; if (!n) return;
  S.lt = { v: n.v.version_id, heard: 0, last: audio.currentTime };
}
function listenTick() {
  const lt = S.lt; if (!lt || audio.paused || !S.now || S.now.v.version_id !== lt.v) return;
  if (lt.last == null) { lt.last = audio.currentTime; return; }   // just after a jump: start measuring again from here
  const d = audio.currentTime - lt.last; lt.last = audio.currentTime;
  // jumps (seeking) are excluded by the seeking event; this cap is only a safety net, scaled to playback speed
  if (d > 0 && d < 2 * Math.max(1, audio.playbackRate || 1) + 1) lt.heard += d;
}
function listenEnd(finished) {
  const lt = S.lt; S.lt = null; if (!lt) return;
  const dur = audio.duration && isFinite(audio.duration) ? audio.duration : durSecs((ver(lt.v) || {}).duration) || 0;
  const heard = lt.heard;
  let o = heard >= 30 ? 'partial' : 'skip';
  if (finished && heard >= Math.min(30, dur * 0.5)) o = 'complete';
  if (o === 'skip' && heard < 3) return;   // an accidental tap, not a skip
  const q = ls.get(LQ_KEY, []);
  q.push({ v: lt.v, o, s: Math.round(heard), p: dur ? Math.min(100, Math.round(heard / dur * 100)) : 0, t: Date.now(),
           d: matchMedia('(max-width: 760px)').matches ? 'phone' : 'desktop' });
  ls.set(LQ_KEY, q.slice(-200));
  if (q.length >= 10) flushListens();
}
function listenPayload(q) { return q.map(e => Object.assign({}, e, { ago: Math.max(0, (Date.now() - e.t) / 1000) })); }
async function flushListens() {
  if (S.lqBusy) return;
  const q = ls.get(LQ_KEY, []); if (!q.length) return;
  S.lqBusy = true;
  try {
    await run('logListens', BOOT.key, BOOT.token, deviceId(), listenPayload(q));
    const now = ls.get(LQ_KEY, []); ls.set(LQ_KEY, now.slice(q.length));   // keep anything added while sending
  } catch (e) { /* stays queued; retried on the next flush */ }
  S.lqBusy = false;
}
// Leaving the page: count the current song and hand the batch off even as the tab closes.
function flushOnLeave() {
  if (S.lt) listenEnd(false);
  const q = ls.get(LQ_KEY, []); if (!q.length || !BOOT.api || !navigator.sendBeacon) return;
  const body = JSON.stringify({ fn: 'logListens', args: [BOOT.key, BOOT.token, deviceId(), listenPayload(q)] });
  if (navigator.sendBeacon(BOOT.api, new Blob([body], { type: 'text/plain' }))) ls.set(LQ_KEY, []);
}

const FORMAT_MIME = { WAV: 'audio/wav', AIF: 'audio/aiff', AIFF: 'audio/aiff', FLAC: 'audio/flac', M4A: 'audio/mp4', MP3: 'audio/mpeg', OGG: 'audio/ogg' };
// Asks Drive for the first bytes itself, so we can read Drive's actual error reason.
async function diagnoseStream(url) {
  if (!/googleapis\.com\/drive/.test(String(url))) return { kind: 'no-api' };
  // A plain GET (no extra headers, so no CORS pre-check); cancelled as soon as Drive answers so a big file never downloads.
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 15000);
  let res;

  clearTimeout(timer);

  let body = ''; try { body = (await res.text()).toLowerCase(); } catch (e) {}
  const has = re => re.test(body);

  if (has(/api_key_service_blocked|are blocked|not authorized to use this api/)) return { kind: 'key-api-restricted', status: res.status };
  if (has(/accessnotconfigured|service_disabled|has not been used in project|is disabled/)) return { kind: 'api-off', status: res.status };
  if (has(/api key not valid|keyinvalid|api_key_invalid/)) return { kind: 'bad-key', status: res.status };
  if (has(/downloadquotaexceeded|ratelimitexceeded|userratelimit|quota/)) return { kind: 'quota', status: res.status };
  if (res.status === 403 || res.status === 404) return { kind: 'private', status: res.status };
  return { kind: 'other', status: res.status };
}

    if (d.kind === 'format' && cantFormat) return `This song is a ${fmt} file, which this browser can't play. Try Safari, or check back soon.`;
    if (d.kind === 'offline' || d.kind === 'network') return 'Your connection dropped. Check your internet and try again.';
    return 'This song could not be loaded. Try again in a minute.';
  }
  switch (d.kind) {
    case 'referrer': return 'Your Drive API key has a website restriction that blocks this app (it runs on a googleusercontent.com address, not script.google.com). In Google Cloud › APIs & Services › Credentials, open the key and set Application restrictions to None. Keep API restrictions on Google Drive API.';
    case 'key-api-restricted': return "Your API key isn't allowed to use the Google Drive API. In Google Cloud › Credentials, open the key and add Google Drive API under API restrictions.";
    case 'api-off': return 'The Google Drive API is turned off for the project your key belongs to. In Google Cloud › APIs & Services › Library, open Google Drive API and click Enable.';
    case 'bad-key': return "The drive_api_key in your Settings tab isn't a valid key. Copy it again from Google Cloud › Credentials (no spaces).";
    case 'quota': return 'Google is temporarily limiting downloads of this file because it was played a lot in a short time. It usually clears within a day. MP3 previews (Make previews) make this much less likely.';
    case 'private': return "Drive wouldn't share this file for playback even after the app re-opened it. Check that the file still exists and that you own it.";
    case 'format': return cantFormat
      ? `Drive sent the file, but this browser can't play ${fmt} files. Tap Make previews to create an MP3 that plays everywhere.`
      : `Drive sent the file, but the browser couldn't decode this one${fmt ? ' (' + fmt + ')' : ''}. It may use an unusual bit depth or be damaged. An MP3 preview (Make previews) usually fixes it.`;
    case 'offline': case 'network': return "Couldn't reach Drive. Check your internet and try again.";
    case 'no-api': return 'Drive sent back a web page instead of audio. Add a Drive API key in Settings (drive_api_key) to stream reliably.';

async function checkPlayback(btn) {

  (lib.releases || []).forEach(r => str(r, ['title', 'artist_name', 'world_tagline', 'world_story', 'recorded_at', 'series_name', 'series_part', 'genre', 'album_credits', 'world_mood']));
  (lib.tracks || []).forEach(t => str(t, ['title', 'artist', 'features', 'producer', 'engineer', 'chapter', 'number_label', 'genre', 'lyrics', 'notes', 'key', 'bpm']));
  (lib.versions || []).forEach(v => str(v, ['label', 'duration']));
  (lib.extras || []).forEach(x => str(x, ['title', 'url']));
  return lib;
}

const splitNames = s => String(s || '').split(/\s*(?:,|&|\/|;|\band\b|\bfeat\.?\b|\bx\b)\s*/i).map(x => x.trim()).filter(x => x && x.length < 80);
function creditsFrom(text, re) {
  const out = [];
  String(text || '').split('\n').forEach(line => { const m = /^\s*([^:]{2,40}):\s*(.+)$/.exec(line); if (m && re.test(m[1])) out.push(...splitNames(m[2])); });
  return out;
}
function buildLore() {
  const rs = S.lib.releases.slice().sort((a, b) => relDateKey(a).localeCompare(relDateKey(b)));
  const idx = { producers: new Map(), engineers: new Map(), features: new Map(), places: new Map(), photographers: new Map() };
  const add = (map, name, rTitle) => { const k = name.toLowerCase(); const e = map.get(k) || { name, releases: new Set(), n: 0 }; e.releases.add(rTitle); e.n++; map.set(k, e); };
  const eras = rs.map(r => {
    const ts = tracksOf(r.release_id, true), vids = eraVideos(r, ts), meta = videosMeta(r);
    const vcount = {}; vids.forEach(v => { const t = meta.types[vKey(v)] || 'music'; vcount[t] = (vcount[t] || 0) + 1; });
    const prod = new Set(), eng = new Set(), feat = new Set();
    ts.forEach(t => { splitNames(t.producer).forEach(n => { prod.add(n); add(idx.producers, n, r.title); });
      splitNames(t.engineer).forEach(n => { eng.add(n); add(idx.engineers, n, r.title); });
      splitNames(t.features).forEach(n => { feat.add(n); add(idx.features, n, r.title); }); });
    creditsFrom(r.album_credits, /produc|prod\b|beat/i).forEach(n => { if (!prod.has(n)) { prod.add(n); add(idx.producers, n, r.title); } });
    creditsFrom(r.album_credits, /mix|master|engineer|record/i).forEach(n => { if (!eng.has(n)) { eng.add(n); add(idx.engineers, n, r.title); } });
    creditsFrom(photosMeta(r).credits, /photo|shot|camera|director of photography/i).forEach(n => add(idx.photographers, n, r.title));
    if (String(r.recorded_at || '').trim()) add(idx.places, r.recorded_at.trim(), r.title);
    return { r, songs: ts.length, runtime: runtimeOf(ts), prod: [...prod], eng: [...eng], feat: [...feat], vcount, photos: extrasOf(r.release_id, 'photo').length,
             as: relArtist(r), ages: agesOf(r) };
  });
  const years = rs.map(r => Number(r.year)).filter(Boolean);
  return { eras, idx, totals: { releases: rs.length, songs: S.lib.tracks.length, videos: eras.reduce((a, e) => a + Object.values(e.vcount).reduce((x, y) => x + y, 0), 0),

}

  if (!/youtube(-nocookie)?\.com$/.test((() => { try { return new URL(e.origin).hostname; } catch (x) { return ''; } })())) return;
  let d; try { d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch (x) { return; }

/* ── album credits → each song's credits ──
   "Produced by: Shake"            every song (fills in songs that don't list their own)
   "Vocals: Aziza (1, 3-5)"         just those songs (by number or title)

const normT = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const SONG_ROLE = /produc|prod\b|beat|mix|master|engineer|record|feat|vocal|sing|writ|compos|lyric|arrang|program|guitar|bass|drum|keys|keyboard|piano|synth|string|horn|sax|trumpet|violin|cello|percussion|instrument/i;

function creditField(role) {
  if (/feat|featuring/i.test(role)) return 'features';
  if (/produc|prod\b|beat/i.test(role) && !/executive/i.test(role)) return 'producer';
  if (/engineer|record/i.test(role) && !/mix|master/i.test(role)) return 'engineer';

}
function creditRole(l) {

  if (m) return [m[1].trim(), m[2].trim()];
  m = /^(.{2,40}?\bby)\s+(.+)$/i.exec(l);                 // "Produced by Shake"
  if (m) return [m[1].trim(), m[2].trim()];
  m = /^(feat\.?|featuring|ft\.?)\s+(.+)$/i.exec(l);

}
function parseAlbumCredits(r) {

  const ts = tracksOf(r.release_id, true), byNo = {}, byTitle = {};
  ts.forEach(t => { const n = String(numLabel(t)).toLowerCase(); if (n) byNo[n] = t; byTitle[normT(t.title)] = t; });
  ts.forEach((t, i) => { if (!byNo[String(i + 1)]) byNo[String(i + 1)] = t; });
  const find = x => byNo[String(x).trim().toLowerCase()] || byTitle[normT(x)] || null;
  const targets = list => {
    const got = [];
    for (const part of list.split(/\s*[,;&]\s*|\s+and\s+/i)) {
      const p = part.trim().replace(/^(tracks?|songs?|on)\s+/i, ''); if (!p) continue;
      const rg = /^(\d{1,3})\s*[-–]\s*(\d{1,3})$/.exec(p);
      if (rg) { for (let k = +rg[1]; k <= +rg[2] && k - rg[1] < 100; k++) { const t = find(k); if (!t) return null; got.push(t); } continue; }

  };

    const bare = l.replace(/:\s*$/, '').trim();
    const m = /^(?:track\s*)?(\d{1,3}[a-z]?)\s*[.)\-–:]\s*(.+)$/i.exec(bare);
    if (m) { const t = byNo[m[1].toLowerCase()]; if (t && (normT(m[2]) === normT(t.title) || !creditRole(m[2]))) return t; if (byTitle[normT(m[2])]) return byTitle[normT(m[2])]; }

}

function songCreditRows(t) {

function albumCreditsHtml(r) {

    ${ac.blocks.map(b => `<div class="acblock"><button class="acsong" data-track-play="${esc(b.t.track_id)}">${esc(numLabel(b.t))}. ${esc(b.t.title)}</button>

// For the owner's credit editor: what this song picks up from the album credits.
function albumCreditNote(t) {
